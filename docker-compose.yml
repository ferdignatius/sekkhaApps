version: "3.8"

services:
  sekkha-api:
    build:
      context: ./sekkha-api
      dockerfile: Dockerfile
    image: ferdignatius/sekkha-api:latest
    container_name: sekkha-api
    restart: unless-stopped
    env_file:
      - ./sekkha-api/.env
    networks:
      - proxy-tier
      - data-tier
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  sekkha-frontend:
    build:
      context: ./sekkha-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000/api}
    image: ferdignatius/sekkha-frontend:latest
    container_name: sekkha-frontend
    restart: unless-stopped
    env_file:
      - ./sekkha-frontend/.env
    networks:
      - proxy-tier
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy-tier:
    external: true
  data-tier:
    external: true
