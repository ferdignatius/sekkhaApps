services:
  sekkha-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ferdignatius/sekkha-api:latest
    container_name: sekkha-api
    restart: unless-stopped

    env_file:
      - .env

    networks:
      - proxy-tier
      - data-tier

    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider https://sekkha.ferdignatius.my.id/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          memory: 128M

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy-tier:
    external: true
  data-tier:
    external: true
